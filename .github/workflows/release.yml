name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: git-cliff

      - name: Drop the local tag so git-cliff reads its commits as unreleased
        run: git tag -d "${{ github.ref_name }}" >/dev/null

      - name: Verify tag matches the version computed from commits
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          if [ -z "$(git tag -l)" ]; then
            echo "No prior tags found; skipping the bump check for this repository's first release."
            exit 0
          fi
          BUMPED_VERSION="$(git-cliff --config cliff.toml --bumped-version)"
          if [ "$BUMPED_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match the version git-cliff computes from the commits since the last release (${BUMPED_VERSION}). Delete the tag, re-tag as ${BUMPED_VERSION}, and push again: git tag -d ${TAG_VERSION} && git push origin :refs/tags/${TAG_VERSION} && git tag ${BUMPED_VERSION} && git push --follow-tags"
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -switch "$latest"; fi
          swift --version

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Write Sparkle private key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_private.key"

      - name: Build, sign, notarize, appcast
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle_ed_private.key
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: bash scripts/release.sh "${{ steps.v.outputs.version }}"

      - name: Generate CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-cliff --config cliff.toml --tag "${{ github.ref_name }}" --output CHANGELOG.md

      - name: Extract release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git-cliff --config cliff.toml --tag "${{ github.ref_name }}" --unreleased --strip all \
            > "$RUNNER_TEMP/release-notes.md"
          {
            echo 'body<<EOF'
            cat "$RUNNER_TEMP/release-notes.md"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" dist/*.dmg \
            --title "${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest

      - name: Commit CHANGELOG and appcast
        run: |
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"
          cp dist/appcast.xml "$RUNNER_TEMP/appcast.xml"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -f -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          git add CHANGELOG.md appcast.xml
          git diff --cached --quiet || git commit -m "chore(release): ${{ github.ref_name }}"
          git push origin "HEAD:$DEFAULT_BRANCH" \
            || echo "::warning::CHANGELOG and appcast did not reach ${DEFAULT_BRANCH}; Sparkle will not offer this release until they land"

      - name: Send GitHub Release to Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD }}
          release_name: ${{ github.ref_name }}
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          color: "8150256"
          username: "dotsync"
          content: "New dotsync release"
          footer_title: "dotsync"
          footer_timestamp: true
