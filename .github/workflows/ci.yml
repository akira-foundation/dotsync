name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -switch "$latest"; fi
          swift --version
      - name: Check formatting
        run: bash scripts/format.sh --lint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -switch "$latest"; fi
          swift --version
      - name: Install age
        run: brew install age
      - name: Configure git identity
        run: |
          git config --global user.name "dotsync-ci"
          git config --global user.email "ci@users.noreply.github.com"
      - name: Run package tests
        run: swift test --arch arm64
